<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaart · Familie Oosterom</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="site">
  <a class="brand" href="index.html">Familie Oosterom</a>
  <nav><a href="index.html">Verhaal</a><a href="stamboom.html">Stamboom</a><a class="active" href="kaart.html">Kaart</a><a href="bronnen.html">Bronnen</a></nav>
</header>
<main class="wide"><div id="map"></div></main>
<script>
(function () {
  "use strict";
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const map = L.map("map").setView([51.955, 4.89], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 16, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  // The route of the direct line, generation by generation
  const ROUTE = [["Lopikerkapel", "1717–1801"], ["Jaarsveld", "1801–1830"], ["Polsbroek", "1830–1908"], ["Bergambacht", "1909–"]];
  const extra = {
    "Lopikerkapel": "Hier werden de Van Oostrums in de 18e eeuw gedoopt en getrouwd (Huijbert 1751, Teunis 1787).",
    "Jaarsveld": "Dijkdorp aan de Lek. Hier woonden de Smetsers al in de 16e eeuw als schipper en boer (goed Oversloot, ca. 1580). Teunis van Oostrum woonde hier als schipper; zijn zoon Arie werd hier in 1801 geboren en was in 1830 ook schipper. Teunis en Geertje Dekker stierven hier in augustus 1830.",
    "Polsbroek": "Arie (1801) werd hier boer in Zuid-Polsbroek. Zijn zoon Teunis (1847) was landbouwer in huis nr. 33 en kreeg hier negentien kinderen. Arie Oosterom werd hier in 1908 geboren.",
    "Willige Langerak": "Arie Oosterom trouwde hier in 1830 met Elisabeth Kooiman.",
    "Benschop": "Teunis Oosterom trouwde hier in 1870 met Adriana Cornelia Lekkerkerker.",
    "Bergambacht": "Vanaf 1909 woonde het gezin van Pieter Oosterom en Willempje Lekkerkerker hier. Pieter overleed hier in 1959.",
    "Noordeloos": "Geertje Dekker, de vrouw van Teunis van Oostrum, kwam hiervandaan.",
    "Montfoort": "Annetje van Oostrum Smetser trouwde hier in 1649 met Hendrick Jacobs Speyert, burgemeester van Montfoort.",
    "Portengen": "Arie van Oostrum (1756–1841), broer van Teunis, woonde hier en in Ter Aa met Engeltje Kool.",
    "Vreeswijk": "Jan van Oostrum (1699), schipper, zoon van Jan Ariensz, trouwde hier in 1746.",
    "Ameide": "Gerrigje van Oostrum (1753), dochter van Huijbert, overleed hier in 1814.",
  };
  Promise.all([fetch("data/familie.json").then((r) => r.json()), fetch("data/plaatsen.json").then((r) => r.json())])
    .then(([data, pl]) => {
      L.polyline(ROUTE.map(([p]) => pl[p]), { color: css("--oosterom"), weight: 4, opacity: .75, dashArray: "8 6" })
        .bindTooltip("De rechte lijn: Lopikerkapel → Jaarsveld → Polsbroek → Bergambacht").addTo(map);
      const byPlace = {};
      Object.values(data.people).forEach((p) => {
        if (p.place) (byPlace[p.place] = byPlace[p.place] || []).push(p);
      });
      Object.entries(pl).forEach(([name, ll]) => {
        const ppl = byPlace[name] || [];
        const list = ppl.map((p) => `<li>${p.name}${p.born ? " (" + String(p.born).split("-").pop() + ")" : ""}</li>`).join("");
        const html = `<b>${name}</b>${extra[name] ? `<p style="margin:4px 0">${extra[name]}</p>` : ""}${list ? `<div>Geboren / gedoopt:</div><ul style="margin:2px 0;padding-left:16px;max-height:180px;overflow:auto">${list}</ul>` : ""}`;
        L.circleMarker(ll, { radius: ROUTE.some(([p]) => p === name) ? 9 : 6, color: "#fff", weight: 2, fillColor: css("--oosterom"), fillOpacity: .95 })
          .bindPopup(html).addTo(map);
      });
      const legend = L.control({ position: "bottomleft" });
      legend.onAdd = () => {
        const d = L.DomUtil.create("div", "legend");
        d.innerHTML = ROUTE.map(([p, y]) => `<div><span class="sw" style="background:${css("--oosterom")}"></span>${p} ${y}</div>`).join("");
        return d;
      };
      legend.addTo(map);
    });
})();
</script>
</body>
</html>
